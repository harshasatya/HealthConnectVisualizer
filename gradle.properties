# Increase Gradle's memory heap size to prevent OutOfMemoryErrors during build.
org.gradle.jvmargs=-Xmx4g

# Use AndroidX (required by all modern Android libraries).
android.useAndroidX=true
# Automatically convert any legacy Android Support Library dependencies
# (e.g. MPAndroidChart) to AndroidX equivalents at build time.
android.enableJetifier=true
